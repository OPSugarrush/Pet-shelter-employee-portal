<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pet Shelter Portal</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="shelterStyle.css">
        
        <script src="shelterMain.js" defer></script>
    </head>
    <body class="bg-light">

        <div class="title-bar mb-4">
            <h1>Pet Shelter Employee Portal</h1>
        </div>

        <div class="container">

            <div id="connectionAlert" class="alert alert-danger d-none"></div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <select id="shelterSelect" class="form-select">
                        <option value="">Loading Shelters...</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="sizeSelect" class="form-select">
                        <option value="">All Sizes</option>
                        <option value="Small">Small</option>
                        <option value="Medium">Medium</option>
                        <option value="Large">Large</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button id="loadAnimals" class="btn btn-primary w-100">Load Animals</button>
                </div>
            </div>

            <div id="shelterDetails" class="mb-4"></div>

            <div class="row g-4">
                <div class="col-md-5">
                    <div id="animalList" class="list-group shadow-sm"></div>
                </div>
                <div class="col-md-7">
                    <div id="animalProfile" class="card shadow-sm d-none"></div>
                </div>
            </div>

            <hr class="my-5">

            <div class="bg-white p-4 rounded shadow-sm mb-5">
                <h4 class="mb-3">Add New Animal</h4>
                <p id="formMessage"></p>

            <form id="animalForm" class="row g-3">

                <div class="col-md-6">
                    <label for="name" class="form-label">Name</label>
                    <input id="name" name="name" class="form-control" required autocomplete="off"> <!-- All "autocomplete="off"" Google Chrome autofill fix from https://www.w3schools.com/howto/howto_html_autocomplete_off.asp to correctly satisfy modern browser settings. -->
                </div>

                <div class="col-md-6">
                    <label for="type" class="form-label">Type (Dog/Cat)</label>
                    <input id="type" name="type" class="form-control" required autocomplete="off">
                </div>

                <div class="col-md-4">
                    <label for="size" class="form-label">Size</label>
                    <select id="size" name="size" class="form-select" required autocomplete="off">
                        <option value="Small">Small</option>
                        <option value="Medium">Medium</option>
                        <option value="Large">Large</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="age" class="form-label">Age (1-30)</label>
                    <input id="age" name="age" type="number" class="form-control" required autocomplete="off">
                </div>

                <div class="col-md-4">
                    <label for="shelterId" class="form-label">Shelter ID (1-5)</label>
                    <input id="shelterId" name="shelterId" type="number" class="form-control" required autocomplete="off">
                </div>

                <div class="col-12">
                    <label for="image" class="form-label">Image (JPEG) (Optional)</label>
                    <input id="image" name="image" type="file" class="form-control" accept=".jpg,.jpeg">
                </div>

                <div class="col-12">
                    <button class="btn btn-success px-5">Add Animal</button>
                </div>
            </form>

            </div>
        
            <div class="bg-white p-4 rounded shadow-sm mb-5">
                <h4 class="mb-3">Edit Existing Animal</h4>
                <p id="editFormMessage"></p>

                <form id="editAnimalForm" class="row g-3">

                    <div class="col-md-4">
                        <label for="editId" class="form-label">Animal's ID</label>
                        <input id="editId" name="id" type="number" class="form-control" required autocomplete="off">
                    </div>

                    <div class="col-md-6">
                        <label for="editName" class="form-label">Existing Name</label>
                        <input id="editName" name="name" class="form-control" required autocomplete="off">
                    </div>

                    <div class="col-md-6">
                        <label for="editType" class="form-label">Existing Type (Dog/Cat)</label>
                        <input id="editType" name="type" class="form-control" required autocomplete="off">
                    </div>

                    <div class="col-md-4">
                        <label for="editSize" class="form-label">New Size</label>
                        <select id="editSize" name="size" class="form-select" required autocomplete="off">
                            <option value="Small">Small</option>
                            <option value="Medium">Medium</option>
                            <option value="Large">Large</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="editAge" class="form-label">New Age (1-30)</label>
                        <input id="editAge" name="age" type="number" class="form-control" required autocomplete="off">
                    </div>

                    <div class="col-md-4">
                        <label for="editShelterId" class="form-label">New Shelter ID (1-5)</label>
                        <input id="editShelterId" name="shelterId" type="number" class="form-control" required autocomplete="off">
                    </div>

                    <div class="col-12">
                        <label for="editImage" class="form-label">New Image (JPEG) (Optional)</label>
                        <input id="editImage" name="image" type="file" class="form-control" accept=".jpg,.jpeg">
                    </div>

                    <div class="col-12">
                        <button class="btn btn-warning px-5">Update Animal</button>
                    </div>
                </form>
            </div>

        </div>

    </body>
</html>
